[project]
name = "hackathon-for-race"
version = "0.3.0"
description = "Secure eldercare Agent with Input Guard, Skills, Tool Gateway, and MySQL persistence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.62",
    "botocore>=1.43.62",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mysql-connector-python>=9.0.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
