apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-care-ui
  labels:
    app: smart-care-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-care-ui
  template:
    metadata:
      labels:
        app: smart-care-ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/edwin-tu/hackathon-for-race:${{ github.sha }}
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: smart-care-config
            - secretRef:
                name: smart-care-secret
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "200m"
              memory: "128Mi"
