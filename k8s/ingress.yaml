apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-care-ui-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - smart-care.example.com
      secretName: smart-care-tls
  rules:
    - host: smart-care.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smart-care-ui
                port:
                  number: 80
