AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Video Generator Infrastructure

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  
  ProjectName:
    Type: String
    Default: hackathon-video

Globals:
  Function:
    Timeout: 300
    Runtime: nodejs20.x
    MemorySize: 512

Resources:
  # S3 Bucket - 圖片上傳
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-images-${Environment}-${AWS::Region}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # S3 Bucket - 影片儲存
  VideosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-videos-${Environment}-${AWS::Region}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET]
            AllowedOrigins: ['*']
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # S3 Bucket Policy - 影片公開讀取
  VideosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref VideosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${VideosBucket.Arn}/*'

  # DynamoDB Table
  VideoTasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-video-tasks-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: taskId
          AttributeType: S
        - AttributeName: residentId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: taskId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: residentId-createdAt-index
          KeySchema:
            - AttributeName: residentId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Lambda Function
  GenerateVideoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-generate-video-${Environment}'
      CodeUri: ../lambda/generate-video/
      Handler: index.handler
      Environment:
        Variables:
          AWS_S3_IMAGES_BUCKET: !Ref ImagesBucket
          AWS_S3_VIDEOS_BUCKET: !Ref VideosBucket
          AWS_DYNAMODB_TABLE_VIDEO_TASKS: !Ref VideoTasksTable
          AWS_BEDROCK_MODEL_ID: luma.ray-v2:0
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
        - S3CrudPolicy:
            BucketName: !Ref VideosBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref VideoTasksTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:StartAsyncInvoke
                - bedrock:GetAsyncInvoke
              Resource: '*'
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket: !Ref ImagesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: images/

Outputs:
  ImagesBucketName:
    Description: S3 Bucket for uploaded images
    Value: !Ref ImagesBucket
    Export:
      Name: !Sub '${AWS::StackName}-ImagesBucket'

  VideosBucketName:
    Description: S3 Bucket for generated videos
    Value: !Ref VideosBucket
    Export:
      Name: !Sub '${AWS::StackName}-VideosBucket'

  VideoTasksTableName:
    Description: DynamoDB Table for video tasks
    Value: !Ref VideoTasksTable
    Export:
      Name: !Sub '${AWS::StackName}-VideoTasksTable'

  GenerateVideoFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt GenerateVideoFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GenerateVideoFunctionArn'
